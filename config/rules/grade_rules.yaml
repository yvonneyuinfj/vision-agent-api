# 判级规则（需求 §5.1：规则由客户业务专家提供并确认后固化）
# 说明：按最高严重度 / 最高置信度 / 结果族 三类判据求值；命中 need_review 即转人工复核。

# 严重度 -> 判级级别（数值越高越严重）
max_severity:
  high: 3
  medium: 2
  low: 1
  # 算法不支持严重度（severity=null）时按最低处理，由人工兜底
  null: 0

# 置信度阈值：模型检测结果（最高置信度）低于该值 = 结果不可信，转人工复核；
# 达标则采信模型结论自动判级（need_review 规则文本中的数值即生效阈值）
confidence_threshold: 0.5

# 命中任一条件即触发人工复核（逐条求值，全部可审计）
need_review:
  - "max_severity >= 3"        # 存在 high 缺陷（高风险结论必须人工确认）
  - "max_confidence < 0.5"     # 检测结果低于设定阈值：最高置信度仍不达标，模型没有把握
  - "family == classification" # 模式分类无严重度语义，常规人工确认