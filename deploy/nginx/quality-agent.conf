# ============================================================================
# 动力所工业图像智能质检 Agent —— 前后端分离 Nginx 站点配置
#
# 模型：Nginx 对外托管前端静态（Vue3 dist）并把 /api/v1 反代到只监听回环的后端。
#   - Nginx 占对外端口（园区网规范用高位段，示例 18000）
#   - 后端 app/main.py 只听 127.0.0.1:18010（.env 的 API_HOST/API_PORT）
#   - 前端 VITE_QA_API_BASE=/api/v1（相对路径）+ credentials:include，经同源反代自动带会话 Cookie
#
# 用法：
#   1) 把顶层 frontend/ 构建产物（npm run build 的 dist/）放到 WEB_ROOT（下例）
#   2) 按需改 server_name / listen / WEB_ROOT / 后端端口
#   3) 放入 /etc/nginx/conf.d/ 或 sites-enabled/，nginx -t 校验后 reload
# ============================================================================

# 后端上游：与 .env 的 API_HOST=127.0.0.1 / API_PORT=18010 保持一致
upstream qcagent_backend {
    server 127.0.0.1:18010;
    keepalive 32;
}

server {
    listen      18000;
    server_name _;                       # 园区网按 IP 直连可保持 _；有域名/证书再补 443

    # ---- 前端静态根目录（Vue3 dist 的落位；按实际部署路径修改）----
    root  /opt/agent/vision-agent/web;
    index index.html;

    # 上传体积对齐后端 MAX_UPLOAD_BYTES（20971520 = 20M）
    client_max_body_size 20m;

    # 静态资源压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # SPA history 路由：真实文件直出，其余无扩展名路径回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长缓存（Vite 产物在 /assets/）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API 反向代理（保留原始 /api/... 路径，proxy_pass 不带尾斜杠）----
    location /api/ {
        proxy_pass         http://qcagent_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 会话 Cookie 透传（后端 httpOnly 会话 Cookie 依赖同源）
        proxy_set_header Connection        "";

        # Agent 流式输出（SSE）：必须关缓冲，否则思考流/增量被 Nginx 攒着不发
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OpenAPI / 文档（如需对外暴露）
    location /docs        { proxy_pass http://qcagent_backend; }
    location /redoc       { proxy_pass http://qcagent_backend; }
    location /openapi.json{ proxy_pass http://qcagent_backend; }
}
